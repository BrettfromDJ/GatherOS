<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GatherOS search landing — five layout directions</title>
<style>
  :root {
    --canvas: #FAFAF9;
    --surface: #FFFFFF;
    --surface-2: #F4F4F2;
    --border: rgba(0,0,0,0.07);
    --border-strong: rgba(0,0,0,0.12);
    --ink: #000000;
    --ink-2: rgba(0,0,0,0.55);
    --ink-3: rgba(0,0,0,0.40);
    --hover: #EAEAEA;
    --radius-card: 16px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
    --shadow-float: 0 2px 6px rgba(0,0,0,0.06), 0 20px 50px rgba(0,0,0,0.10);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: #E9E9E7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  /* ── Prototype navigator ─────────────────────────────────────────── */
  .protoNav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
    height: 52px; padding: 0 18px;
    background: rgba(20,20,22,0.92);
    backdrop-filter: blur(20px);
    color: #fff;
  }
  .protoNav .brand { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.95; margin-right: 6px; white-space: nowrap; }
  .protoTabs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; }
  .protoTab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: transparent; color: rgba(255,255,255,0.72);
    font-family: var(--font); font-size: 12.5px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .protoTab:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .protoTab .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px;
    background: rgba(255,255,255,0.14); font-size: 11px; font-weight: 600;
  }
  .protoTab.active { background: #fff; color: #111; border-color: #fff; }
  .protoTab.active .num { background: rgba(0,0,0,0.10); color: #111; }
  .protoHint { font-size: 11.5px; color: rgba(255,255,255,0.5); white-space: nowrap; }

  /* ── Stage ───────────────────────────────────────────────────────── */
  .stage { padding-top: 52px; }
  .iter { display: none; }
  .iter.active { display: block; }
  .iterHead { padding: 20px 30px 14px; max-width: 1400px; margin: 0 auto; }
  .iterHead .name { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
  .iterHead .why { margin-top: 6px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); max-width: 760px; }

  /* The app frame — a rounded window that holds each mockup. */
  .app {
    position: relative;
    max-width: 1400px; margin: 0 auto 44px; height: 860px;
    background: var(--canvas);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    box-shadow: var(--shadow-float);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ── GatherOS top bar (shared) ───────────────────────────────────── */
  .topbar {
    flex: none; height: 62px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 22px;
  }
  .tbLeft { display: flex; align-items: center; gap: 9px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(150deg, #111, #3a3a3a);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .tbSwitcher { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; cursor: default; }
  .tbSwitcher svg { opacity: 0.4; }

  .navPill {
    justify-self: center;
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 5px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.05);
  }
  .navSeg {
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 18px; border-radius: var(--radius-pill);
    font-size: 14.5px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink);
    background: transparent; border: none; cursor: pointer; white-space: nowrap;
  }
  .navSeg.icon { padding: 0; width: 40px; justify-content: center; }
  .navSeg.active { background: var(--ink); color: #fff; }
  .navSeg:not(.active):hover { background: var(--hover); }

  .tbRight { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .tbSearch {
    display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 12px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--surface);
    color: var(--ink-2); font-size: 13px; cursor: pointer;
  }
  .tbSearch .kbd { font-size: 11px; color: var(--ink-3); }
  .iconBtn {
    width: 34px; height: 34px; border-radius: 9px; border: none; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer;
  }
  .iconBtn:hover { background: var(--hover); }

  /* ── Shared pieces ───────────────────────────────────────────────── */
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .link { font-size: 12.5px; color: var(--ink-3); background: none; border: none; cursor: pointer; }
  .link:hover { color: var(--ink); }

  .field {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 18px; padding: 0 14px 0 18px; height: 60px;
    box-shadow: var(--shadow-card);
  }
  .field.lg { height: 66px; border-radius: 20px; }
  .field.sm { height: 46px; border-radius: var(--radius-pill); box-shadow: none; }
  .field .fieldIcon { color: var(--ink-3); flex: none; }
  .field .ghost { flex: 1; font-size: 18px; color: var(--ink-3); letter-spacing: -0.01em; }
  .field.sm .ghost { font-size: 14.5px; }
  .field .ghost b { color: var(--ink-2); font-weight: 500; }
  .field .caret { width: 1.5px; height: 22px; background: var(--ink); margin-right: -6px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .kbdChip { font-size: 12px; color: var(--ink-3); border: 1px solid var(--border); border-radius: 7px; padding: 3px 6px; }
  .filterBtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer; flex: none; }
  .filterBtn:hover { background: var(--hover); }

  .count { font-size: 13.5px; color: var(--ink-3); }
  .count b { color: var(--ink); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; color: var(--ink); cursor: pointer; font-family: var(--font);
  }
  .chip:hover { background: var(--hover); border-color: var(--border-strong); }
  .chip svg { color: var(--ink-3); flex: none; }

  /* Collection card + cover art */
  .collCard {
    display: flex; flex-direction: column; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 10px; cursor: pointer;
    transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .collCard:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); border-color: var(--border-strong); }
  .cover { display: block; border-radius: 10px; aspect-ratio: 1 / 1; width: 100%; overflow: hidden; background: var(--surface-2); }
  .collName { margin-top: 10px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .collMeta { margin-top: 2px; font-size: 12px; color: var(--ink-3); }

  /* gradient stand-ins for cover thumbnails */
  .cv1 { background: linear-gradient(135deg,#e7e7e4,#fff 55%,#d9d9d6); }
  .cv2 { background: linear-gradient(160deg,#0f3b3a,#1a6b66 60%,#8fd6cf); }
  .cv3 { background: radial-gradient(120% 120% at 20% 10%, #f4f4f2, #111 120%); }
  .cv4 { background: linear-gradient(140deg,#2aa9a0 0%,#e8534e 100%); }
  .cv5 { background: linear-gradient(150deg,#111 0%,#4a4a4a 55%,#e6e6e3 100%); }
  .cv6 { background: conic-gradient(from 210deg at 60% 40%, #f5b0a8, #f4f4f2, #cdd7f0, #f4f4f2); }
  .cv7 { background: linear-gradient(135deg,#f0efec,#c9c9c4); }
  .cv8 { background: linear-gradient(160deg,#ff7a59,#ffb37a 70%,#f4f4f2); }

  .arrows { display: inline-flex; gap: 6px; }
  .arrowBtn { width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .arrowBtn:hover { background: var(--hover); }
  .sectionHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

  .body { flex: 1; min-height: 0; position: relative; overflow: hidden; }

  /* ===== Iter 1 · Launcher ========================================== */
  .l1 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 40px 60px; }
  .l1 .prompt { font-size: 15px; color: var(--ink-3); letter-spacing: -0.01em; }
  .l1 .fieldWrap { width: min(680px, 92%); }
  .l1 .recentRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 680px; }
  .l1 .rail { width: 100%; max-width: 1040px; margin-top: 6px; }
  .l1 .railTrack { display: flex; gap: 14px; overflow: hidden; padding: 2px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
  .l1 .collCard { width: 150px; flex: none; }
  .l1 .tagRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 720px; }

  /* ===== Iter 2 · Two-column split ================================== */
  .l2 { height: 100%; display: grid; grid-template-columns: 380px 1fr; }
  .l2 .left { padding: 40px 34px; display: flex; flex-direction: column; gap: 26px; border-right: 1px solid var(--border); overflow: auto; }
  .l2 .right { padding: 36px 38px; overflow: auto; }
  .l2 .stackHead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .l2 .chips.col { }
  .l2 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .l2 .grid .cover { aspect-ratio: 4 / 3; }

  /* ===== Iter 3 · Collections-first gallery ========================= */
  .l3 { height: 100%; display: flex; flex-direction: column; }
  .l3 .bar { padding: 22px 40px 14px; display: flex; align-items: center; gap: 18px; }
  .l3 .bar .field { flex: 1; }
  .l3 .gallery { flex: 1; overflow: auto; padding: 6px 40px 20px; }
  .l3 .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .l3 .grid .cover { aspect-ratio: 5 / 4; }
  .l3 .footer { flex: none; border-top: 1px solid var(--border); padding: 14px 40px; display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.5); }
  .l3 .footer .grp { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .l3 .footer .chips { flex-wrap: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(90deg,#000 88%,transparent); }
  .l3 .divider { width: 1px; height: 26px; background: var(--border); flex: none; }

  /* ===== Iter 4 · Bento dashboard =================================== */
  .l4 { height: 100%; display: flex; flex-direction: column; padding: 30px 34px 34px; gap: 18px; }
  .l4 .bento { flex: 1; display: grid; grid-template-columns: 1.6fr 1fr; grid-template-rows: 1fr 1fr auto; gap: 18px; min-height: 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 18px 20px; display: flex; flex-direction: column; min-height: 0; }
  .tile .tileHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .l4 .colls { grid-row: 1 / 4; }
  .l4 .collGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; overflow: auto; }
  .l4 .collGrid .cover { aspect-ratio: 16 / 10; }
  .l4 .stat { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 4px; }
  .l4 .stat .big { font-size: 42px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  .l4 .stat .sub { font-size: 13px; color: var(--ink-3); }

  /* ===== Iter 5 · Spotlight orbit =================================== */
  .l5 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 40px; }
  .l5 .count { letter-spacing: 0.02em; }
  .l5 .fieldWrap { width: min(620px, 92%); }
  .l5 .recentRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .l5 .fan { position: relative; height: 210px; width: 720px; }
  .l5 .fan .fanCard {
    position: absolute; top: 0; left: 50%; width: 148px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 15px; padding: 9px; box-shadow: var(--shadow-card);
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .l5 .fan .fanCard .cover { aspect-ratio: 1/1; border-radius: 9px; }
  .l5 .fan .fanCard .fn { margin-top: 9px; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; }
  .l5 .fan .fanCard .fm { margin-top: 1px; font-size: 11px; color: var(--ink-3); }
  .l5 .fan .fanCard:hover { transform: translate(var(--tx), -16px) rotate(0deg) !important; z-index: 30; box-shadow: var(--shadow-float); }
  .l5 .tagRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
</style>
</head>
<body>
  <h1 style="position:absolute;left:-9999px">GatherOS search landing — five layout directions</h1>

  <nav class="protoNav">
    <span class="brand">Search landing · 5 directions</span>
    <div class="protoTabs" id="tabs"></div>
    <span class="protoHint">press 1–5</span>
  </nav>

  <div class="stage" id="stage"></div>

<!-- Shared markup templates -->
<template id="tpl-topbar">
  <div class="topbar">
    <div class="tbLeft">
      <span class="logo">◈</span>
      <span class="tbSwitcher">Library
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9 4-4 4 4"/><path d="m16 15-4 4-4-4"/></svg>
      </span>
    </div>
    <div class="navPill">
      <button class="navSeg icon active" title="Search">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.4" y1="10.4" x2="13.5" y2="13.5"/></svg>
      </button>
      <button class="navSeg">Library</button>
      <button class="navSeg">Collections</button>
      <button class="navSeg">Spaces</button>
    </div>
    <div class="tbRight">
      <span class="tbSearch">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.4" y1="10.4" x2="13.5" y2="13.5"/></svg>
        Search <span class="kbd">⌘K</span>
      </span>
      <button class="iconBtn" title="Explore">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="m14.5 9.5-2 5-5 2 2-5z" fill="currentColor" stroke="none" opacity="0.6"/></svg>
      </button>
      <button class="iconBtn" title="Theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="iconBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 0 1 4 0v.1A1.6 1.6 0 0 0 15 2.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" transform="scale(0.8) translate(3 3)"/></svg>
      </button>
    </div>
  </div>
</template>

<script>
  // ── icons ────────────────────────────────────────────────────────
  const I = {
    search: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.4" y1="10.4" x2="13.5" y2="13.5"/></svg>',
    searchSm: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.4" y1="10.4" x2="13.5" y2="13.5"/></svg>',
    hash: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="13.5" y2="6"/><line x1="2.5" y1="10" x2="13" y2="10"/><line x1="6.5" y1="2.5" x2="5" y2="13.5"/><line x1="11" y1="2.5" x2="9.5" y2="13.5"/></svg>',
    filter: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="4.5" x2="14" y2="4.5"/><line x1="2" y1="11.5" x2="14" y2="11.5"/><circle cx="6" cy="4.5" r="1.7" fill="#fff"/><circle cx="10.5" cy="11.5" r="1.7" fill="#fff"/></svg>',
    left: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    right: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    folder: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  };

  // ── data ─────────────────────────────────────────────────────────
  const COLLECTIONS = [
    { name: 'Branding',      saves: 5, cv: 'cv1' },
    { name: 'Web',           saves: 3, cv: 'cv2' },
    { name: 'Typography',    saves: 1, cv: 'cv3' },
    { name: 'Art',           saves: 1, cv: 'cv4' },
    { name: 'Interfaces',    saves: 2, cv: 'cv5' },
    { name: 'Colors',        saves: 2, cv: 'cv6' },
    { name: 'Landing pages', saves: 1, cv: 'cv8' },
    { name: 'Motion',        saves: 4, cv: 'cv7' },
  ];
  const RECENTS = ['branding', 'navy', 'serif logo'];
  const TAGS = ['cosmos', 'branding', 'corporate', 'gradients', 'logo', 'modern', 'technology'];

  const topbar = () => document.getElementById('tpl-topbar').innerHTML;
  const collCard = (c) => `
    <button class="collCard">
      <span class="cover ${c.cv}"></span>
      <span class="collName">${c.name}</span>
      <span class="collMeta">${c.saves} ${c.saves === 1 ? 'save' : 'saves'}</span>
    </button>`;
  const recentChips = () => RECENTS.map(r => `<button class="chip">${I.searchSm}${r}</button>`).join('');
  const tagChips = () => TAGS.map(t => `<button class="chip">${I.hash}${t}</button>`).join('');
  const heroField = (cls = '') => `
    <div class="field ${cls}">
      <span class="fieldIcon">${I.search}</span>
      <span class="ghost"><span class="caret"></span>Try <b>“tan”</b></span>
      <span class="kbdChip">⌘K</span>
      <span class="filterBtn">${I.filter}</span>
    </div>`;
  const slimField = () => `
    <div class="field sm">
      <span class="fieldIcon">${I.searchSm}</span>
      <span class="ghost">Search titles, tags and sources…</span>
      <span class="kbdChip">⌘K</span>
      <span class="filterBtn">${I.filter}</span>
    </div>`;

  // ── iterations ───────────────────────────────────────────────────
  const ITERS = [
    {
      name: 'Launcher',
      why: 'The field drops to the optical centre like a Spotlight/Raycast launcher — recents sit right beneath it as one-tap re-runs, collections and tags frame it above and below. Fills the vertical space and puts the cursor where the eye already rests.',
      build: () => `
        ${topbar()}
        <div class="body"><div class="l1">
          <div class="prompt">What are you looking for?</div>
          <div class="fieldWrap">${heroField('lg')}</div>
          <div class="recentRow">${recentChips()}</div>
          <div class="rail">
            <div class="sectionHead"><span class="label">Your collections</span><span class="arrows"><span class="arrowBtn">${I.left}</span><span class="arrowBtn">${I.right}</span></span></div>
            <div class="railTrack">${COLLECTIONS.map(collCard).join('')}</div>
          </div>
          <div class="tagRow">${tagChips()}</div>
        </div></div>`,
    },
    {
      name: 'Two-column split',
      why: 'Search and its history live in a calm left rail; the right becomes a proper gallery of collections. Nothing scrolls off the bottom into emptiness — the width does the work, and the collections finally get room to breathe.',
      build: () => `
        ${topbar()}
        <div class="body"><div class="l2">
          <div class="left">
            <div>
              ${heroField('')}
              <div class="count" style="margin-top:12px"><b>124</b> saves in your library</div>
            </div>
            <div>
              <div class="stackHead"><span class="label">Recent</span><button class="link">Clear</button></div>
              <div class="chips col">${recentChips()}</div>
            </div>
            <div>
              <div class="stackHead"><span class="label">Jump to a tag</span></div>
              <div class="chips col">${tagChips()}</div>
            </div>
          </div>
          <div class="right">
            <div class="sectionHead"><span class="label">Your collections</span><span class="arrows"><span class="arrowBtn">${I.left}</span><span class="arrowBtn">${I.right}</span></span></div>
            <div class="grid">${COLLECTIONS.map(collCard).join('')}</div>
          </div>
        </div></div>`,
    },
    {
      name: 'Collections-first gallery',
      why: 'For a visual tool, browsing beats querying. Search shrinks to a slim always-there bar; collections become the hero as a big gallery; recents and tags tuck into a quiet footer rail. You land in your work, not on a form.',
      build: () => `
        ${topbar()}
        <div class="body"><div class="l3">
          <div class="bar">
            ${slimField()}
            <span class="count"><b>124</b> saves</span>
          </div>
          <div class="gallery">
            <div class="sectionHead"><span class="label">Your collections</span></div>
            <div class="grid">${COLLECTIONS.map(collCard).join('')}</div>
          </div>
          <div class="footer">
            <div class="grp"><span class="label">Recent</span><div class="chips">${recentChips()}</div></div>
            <span class="divider"></span>
            <div class="grp"><span class="label">Tags</span><div class="chips">${tagChips()}</div></div>
          </div>
        </div></div>`,
    },
    {
      name: 'Bento dashboard',
      why: 'A dense, pro-tool home: the field spans the top, then a bento of tiles — collections as the big panel, recents and tags as their own cards, a stat block for the library count. Everything visible at once, structured and edge-to-edge.',
      build: () => `
        ${topbar()}
        <div class="body"><div class="l4">
          ${heroField('')}
          <div class="bento">
            <div class="tile colls">
              <div class="tileHead"><span class="label">Your collections</span><span class="arrows"><span class="arrowBtn">${I.left}</span><span class="arrowBtn">${I.right}</span></span></div>
              <div class="collGrid">${COLLECTIONS.map(collCard).join('')}</div>
            </div>
            <div class="tile">
              <div class="tileHead"><span class="label">Recent</span><button class="link">Clear</button></div>
              <div class="chips">${recentChips()}</div>
            </div>
            <div class="tile">
              <div class="tileHead"><span class="label">Jump to a tag</span></div>
              <div class="chips">${tagChips()}</div>
            </div>
            <div class="tile stat">
              <span class="big">124</span>
              <span class="sub">saves in your library</span>
            </div>
          </div>
        </div></div>`,
    },
    {
      name: 'Spotlight orbit',
      why: 'The most meditative take: everything centres on the field and radiates outward — count above, recents just below, a small fanned deck of collections, then tags. Symmetrical, lots of air, and unmistakably part of this quiet monochrome app.',
      build: () => {
        const fan = COLLECTIONS.slice(0, 5).map((c, i) => {
          const spread = (i - 2);
          const tx = spread * 132;
          const rot = spread * 4;
          const y = Math.abs(spread) * 12;
          return `<div class="fanCard" style="--tx:${tx}px;--rot:${rot}deg;transform:translate(calc(-50% + ${tx}px), ${y}px) rotate(${rot}deg);z-index:${10 - Math.abs(spread)}">
            <span class="cover ${c.cv}"></span><div class="fn">${c.name}</div><div class="fm">${c.saves} ${c.saves===1?'save':'saves'}</div>
          </div>`;
        }).join('');
        return `
        ${topbar()}
        <div class="body"><div class="l5">
          <div class="count"><b>124</b> saves in your library</div>
          <div class="fieldWrap">${heroField('lg')}</div>
          <div class="recentRow">${recentChips()}</div>
          <div class="fan">${fan}</div>
          <div class="tagRow">${tagChips()}</div>
        </div></div>`;
      },
    },
  ];

  // ── mount ────────────────────────────────────────────────────────
  const tabsEl = document.getElementById('tabs');
  const stageEl = document.getElementById('stage');
  ITERS.forEach((it, i) => {
    const tab = document.createElement('button');
    tab.className = 'protoTab' + (i === 0 ? ' active' : '');
    tab.innerHTML = `<span class="num">${i + 1}</span>${it.name.toLowerCase()}`;
    tab.addEventListener('click', () => show(i));
    tabsEl.appendChild(tab);

    const iter = document.createElement('section');
    iter.className = 'iter' + (i === 0 ? ' active' : '');
    iter.innerHTML = `
      <div class="iterHead"><div class="name">${i + 1}. ${it.name}</div><div class="why">${it.why}</div></div>
      <div class="app">${it.build()}</div>`;
    stageEl.appendChild(iter);
  });

  function show(i) {
    document.querySelectorAll('.protoTab').forEach((t, k) => t.classList.toggle('active', k === i));
    document.querySelectorAll('.iter').forEach((s, k) => s.classList.toggle('active', k === i));
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  window.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= ITERS.length) show(n - 1);
  });
</script>
</body>
</html>
